<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RZD DES Engine — Северная СДТ</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #c9d1d9; padding: 20px; }
        .dashboard { max-width: 960px; margin: 0 auto; }
        h1 { color: #f44336; font-size: 1.5rem; margin-bottom: 1rem; border-bottom: 1px solid #30363d; padding-bottom: 0.5rem; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 16px; margin-bottom: 12px; }
        h2 { font-size: 1rem; color: #58a6ff; margin-bottom: 8px; }
        label { margin-right: 12px; font-size: 0.85rem; color: #8b949e; }
        input, textarea { background: #0d1117; border: 1px solid #30363d; border-radius: 4px; color: #c9d1d9; padding: 4px 8px; font-size: 0.85rem; }
        textarea { width: 100%; font-family: 'Consolas', 'Courier New', monospace; resize: vertical; }
        button { background: #21262d; border: 1px solid #30363d; border-radius: 6px; color: #c9d1d9; padding: 5px 16px; cursor: pointer; font-size: 0.85rem; margin-right: 8px; }
        button:hover:not(:disabled) { background: #30363d; border-color: #8b949e; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button.primary { background: #238636; border-color: #2ea043; }
        button.primary:hover:not(:disabled) { background: #2ea043; }
        #status, #networkStatus, #scenarioStatus, #scheduleStatus, #runStatus { margin-left: 8px; font-size: 0.8rem; color: #8b949e; }
        .row { margin-top: 8px; }
        pre { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 12px; overflow-x: auto; font-size: 0.75rem; line-height: 1.4; max-height: 400px; overflow-y: auto; }
        table { font-size: 0.85rem; border-collapse: collapse; width: 100%; }
        td { padding: 4px 12px; border-bottom: 1px solid #21262d; }
        td:first-child { color: #8b949e; }
        #results h3 { color: #7ee787; margin: 8px 0; }
    </style>
</head>
<body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
