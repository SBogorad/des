[package]
name = "rzd-cli"
version = "0.1.0"
edition = "2021"
description = "CLI runner for the DES discrete-event simulation engine"
license = "MIT"
repository = "https://github.com/xodapi/des"

[dependencies]
rzd-core = { path = "../crates/rzd-core" }
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
