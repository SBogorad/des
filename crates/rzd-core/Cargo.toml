[package]
name = "rzd-core"
version = "0.1.0"
edition = "2021"
description = "Deterministic discrete-event simulation core for synthetic railway operations"
license = "MIT"
repository = "https://github.com/xodapi/des"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
crossbeam = "0.8"
parking_lot = "0.12"
tracing = "0.1"
rust_xlsxwriter = "0.68"

[dev-dependencies]
criterion = "0.8"
proptest = "1.4"

[[bench]]
name = "engine_bench"
harness = false

[features]
default = ["alloc"]
alloc = []
