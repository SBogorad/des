server {
    listen 80;
    server_name des.syntog.ru;

    root /var/www/des.syntog.ru;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name des.syntog.ru;

    root /var/www/des.syntog.ru;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/des.syntog.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/des.syntog.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /demo {
        return 301 /demo/;
    }

    location ^~ /demo/ {
        try_files $uri $uri/ /demo/index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location ~* \.(?:js|css|json|svg|ico|png|woff2?)$ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
