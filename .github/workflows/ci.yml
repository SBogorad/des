name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          components: clippy, rustfmt
      - run: cargo check --all-targets
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo fmt --all --check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
      - run: cargo test --workspace --all-targets

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          target: wasm32-unknown-unknown
      - run: cargo check -p rzd-wasm --target wasm32-unknown-unknown
      - run: cargo test -p rzd-wasm --test integration
      - uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce
      - run: cargo install wasm-pack --locked
      - run: wasm-pack test --headless --chrome crates/rzd-wasm

  ts-host:
    runs-on: ubuntu-latest
    needs: wasm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo install wasm-pack --locked
      - run: wasm-pack build crates/rzd-wasm --target web --out-dir pkg
      - run: pnpm --dir ts-host install --frozen-lockfile
      - run: pnpm --dir ts-host run build

  benchmark-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
      - name: Run deterministic synthetic benchmark twice
        run: |
          cargo run -p rzd-cli -- benchmark \
            --network data/networks/synthetic_one_road_88_05.json \
            --profile one-road-demo \
            --output benchmark-a.json
          cargo run -p rzd-cli -- benchmark \
            --network data/networks/synthetic_one_road_88_05.json \
            --profile one-road-demo \
            --output benchmark-b.json
      - name: Verify benchmark contract and deterministic trace
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          reports = [json.loads(Path(name).read_text()) for name in ("benchmark-a.json", "benchmark-b.json")]
          for report in reports:
              assert report["schema"] == "rzd-des-benchmark-report/v1"
              assert report["profile"] == "one-road-demo"
              results = report["results"]
              assert results["events_processed"] > 0
              assert results["event_errors"] == 0
              assert len(results["trace_signature"]) == 64
          assert reports[0]["results"]["trace_signature"] == reports[1]["results"]["trace_signature"]
          PY
